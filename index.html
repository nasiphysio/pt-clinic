<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physiclinic — PT Archive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== VARIABLES ===== */
:root {
  --primary: #1a5c4a;
  --primary-light: #22776a;
  --primary-dark: #0d3d2e;
  --accent: #e8a020;
  --bg: #eef2f0;
  --card: #ffffff;
  --text: #162820;
  --muted: #5a7a6e;
  --border: #ccddd6;
  --red: #d94f4f;
  --red-light: #fdeaea;
  --green: #27ae60;
  --green-light: #eafaf1;
  --shadow: 0 2px 14px rgba(13,61,46,0.09);
  --shadow-lg: 0 8px 36px rgba(13,61,46,0.15);
  --radius: 14px;
  --radius-sm: 8px;
}

/* ===== RESET ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }

/* ===== LOGIN ===== */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: var(--primary-dark);
  background-image:
    radial-gradient(circle at 20% 80%, rgba(34,119,106,0.3) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(232,160,32,0.15) 0%, transparent 50%);
}
.login-card {
  background: white;
  border-radius: 20px;
  padding: 44px 40px;
  width: 100%;
  max-width: 380px;
  box-shadow: var(--shadow-lg);
}
.login-logo { text-align: center; margin-bottom: 28px; }
.login-logo h1 { font-size: 26px; font-weight: 700; color: var(--primary-dark); }
.login-logo p { font-size: 13px; color: var(--muted); margin-top: 4px; }
.login-error {
  background: var(--red-light);
  color: var(--red);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px;
  margin-bottom: 14px;
  display: none;
}

/* ===== APP LAYOUT ===== */
#app-screen { display: none; }
.app-wrap { display: flex; min-height: 100vh; }

/* ===== SIDEBAR ===== */
.sidebar {
  width: 240px;
  background: var(--primary-dark);
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  z-index: 100;
  transition: transform 0.3s;
}
.sidebar-logo {
  padding: 22px 18px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.sidebar-logo h2 { color: white; font-size: 17px; font-weight: 700; }
.sidebar-logo small { color: rgba(255,255,255,0.4); font-size: 11px; }
.sidebar-user {
  padding: 12px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.sidebar-user strong { color: white; display: block; font-size: 13px; }
.sidebar-user small { color: rgba(255,255,255,0.5); font-size: 11px; }
.sidebar-nav { padding: 12px 10px; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 13px;
  border-radius: var(--radius-sm);
  color: rgba(255,255,255,0.65);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  transition: all 0.2s;
}
.nav-item:hover { background: rgba(255,255,255,0.1); color: white; }
.nav-item.active { background: var(--accent); color: var(--primary-dark); font-weight: 700; }
.nav-item.disabled { opacity: 0.35; cursor: not-allowed; }
.nav-item.disabled:hover { background: none; color: rgba(255,255,255,0.65); }
.sidebar-footer {
  padding: 14px 18px;
  border-top: 1px solid rgba(255,255,255,0.1);
}
.signout-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.07);
  color: rgba(255,255,255,0.75);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  width: 100%;
  transition: all 0.2s;
}
.signout-btn:hover { background: var(--red); color: white; border-color: var(--red); }

/* ===== MAIN CONTENT ===== */
.main-content { margin-left: 240px; flex: 1; padding: 28px; }

/* ===== PAGE HEADER ===== */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
  flex-wrap: wrap;
  gap: 10px;
}
.page-title { font-size: 22px; font-weight: 700; color: var(--primary-dark); }
.page-subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* ===== CARD ===== */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-light); }
.btn-accent { background: var(--accent); color: var(--primary-dark); }
.btn-accent:hover { opacity: 0.9; }
.btn-danger { background: var(--red-light); color: var(--red); }
.btn-danger:hover { background: var(--red); color: white; }
.btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
.btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
.btn-green { background: #1d6f42; color: white; }
.btn-green:hover { background: #155235; }
.btn-pdf { background: #c0392b; color: white; }
.btn-pdf:hover { background: #a93226; }
.btn-sm { padding: 6px 12px; font-size: 13px; }

/* ===== SEARCH BAR ===== */
.search-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: white;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  box-shadow: var(--shadow);
  border: 1.5px solid var(--border);
  margin-bottom: 16px;
}
.search-bar input {
  border: none;
  outline: none;
  flex: 1;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  background: transparent;
}
.search-bar input::placeholder { color: var(--muted); }

/* ===== PATIENT GRID ===== */
.patient-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.patient-card {
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  border: 2px solid transparent;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.patient-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 4px; height: 100%;
  background: var(--primary);
}
.patient-card:hover { box-shadow: var(--shadow-lg); border-color: var(--primary); transform: translateY(-2px); }
.patient-name { font-size: 16px; font-weight: 700; color: var(--primary-dark); margin-bottom: 4px; }
.patient-meta { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
.status-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
.status-complete { background: var(--green-light); color: var(--green); }
.status-pending { background: #fff8e6; color: #b07a00; }
.patient-actions { display: flex; gap: 7px; padding-top: 10px; border-top: 1px solid var(--border); flex-wrap: wrap; }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(13,61,46,0.5);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: white;
  border-radius: var(--radius);
  width: 100%;
  max-width: 720px;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  transform: translateY(24px);
  transition: transform 0.25s;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-header {
  padding: 20px 22px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: white;
  z-index: 1;
}
.modal-title { font-size: 17px; font-weight: 700; color: var(--primary-dark); }
.modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }
.modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

/* ===== FORM ===== */
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
.form-control {
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 13px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  background: var(--bg);
  width: 100%;
}
.form-control:focus { border-color: var(--primary); background: white; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.section-header {
  background: linear-gradient(90deg, var(--primary-dark), var(--primary));
  color: white;
  padding: 8px 15px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin: 4px 0 6px;
}

/* ===== REGION TABS ===== */
.region-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.region-tab {
  padding: 7px 15px;
  border-radius: 22px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid var(--border);
  background: var(--bg);
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
}
.region-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
.region-tab-add {
  padding: 7px 13px;
  border-radius: 22px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 2px dashed var(--border);
  background: transparent;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
}
.region-tab-add:hover { border-color: var(--primary); color: var(--primary); }
.region-panel { display: none; }
.region-panel.active { display: block; }

/* ===== PILLS ===== */
.pill-group { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 4px; }
.pill {
  display: inline-flex;
  align-items: center;
  padding: 6px 14px;
  border-radius: 22px;
  border: 2px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s;
  appearance: none;
  -webkit-appearance: none;
}
.pill:hover { border-color: var(--primary); background: #e0ede8; color: var(--primary); }
.pill.selected {
  background: var(--primary) !important;
  color: white !important;
  border-color: var(--primary) !important;
  font-weight: 700;
}
.pill.selected::before { content: "✓ "; }
.add-option-row { display: flex; gap: 8px; margin-top: 8px; }
.add-option-row input {
  flex: 1;
  border: 1.5px dashed var(--border);
  border-radius: 22px;
  padding: 6px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  outline: none;
  background: transparent;
}
.add-option-row input:focus { border-color: var(--primary); }
.add-option-row button {
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 22px;
  padding: 6px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

/* ===== VAS ===== */
.vas-container { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.vas-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 2px solid var(--border);
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  transition: all 0.18s;
  color: var(--text);
}
.vas-btn.selected { background: var(--primary); color: white; border-color: var(--primary); transform: scale(1.15); }

/* ===== PROFILE ===== */
.profile-header {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
  border-radius: var(--radius);
  padding: 22px;
  color: white;
  margin-bottom: 16px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.profile-name { font-size: 20px; font-weight: 700; margin-bottom: 3px; }
.profile-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.profile-tag { background: rgba(255,255,255,0.15); border-radius: 20px; padding: 3px 11px; font-size: 12px; font-weight: 500; }
.profile-tag.gold { background: var(--accent); color: var(--primary-dark); font-weight: 700; }
.visit-card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; border-top: 3px solid var(--primary); position: relative; }
.visit-card.followup { border-top-color: var(--accent); }
.visit-type-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
.visit-type-badge.initial { background: var(--green-light); color: var(--green); }
.visit-type-badge.followup { background: #fff3cd; color: #b07a00; }
.visit-delete-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; }
.visit-delete-btn:hover { color: var(--red); }
.visit-edit-btn {
  position: absolute;
  top: 12px;
  right: 40px;
  background: none;
  border: 1.5px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  padding: 3px 8px;
  border-radius: 6px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
}
.visit-edit-btn:hover { border-color: var(--primary); color: var(--primary); }
.region-card { background: var(--bg); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px; border-left: 3px solid var(--primary); }
.region-card-title { font-size: 14px; font-weight: 700; color: var(--primary-dark); margin-bottom: 10px; }
.data-section { margin-bottom: 12px; }
.data-section-title { font-size: 10px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.data-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.data-tag { background: var(--bg); border: 1.5px solid var(--border); padding: 3px 11px; border-radius: 20px; font-size: 12px; font-weight: 500; }
.data-tag.diagnosis { background: var(--green-light); border-color: var(--green); color: #1a6b40; }
.data-tag.problem { background: var(--red-light); border-color: var(--red); color: var(--red); }

/* ===== MANAGE OPTIONS ===== */
.manage-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
.manage-tab {
  padding: 6px 13px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: none;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
}
.manage-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
.option-item { display: flex; align-items: center; gap: 10px; background: var(--bg); padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 6px; }
.option-item span { flex: 1; font-size: 14px; }
.option-remove-btn {
  background: var(--red-light);
  color: var(--red);
  border: 1.5px solid var(--red);
  cursor: pointer;
  font-size: 13px;
  padding: 5px 12px;
  border-radius: 6px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  transition: all 0.2s;
  white-space: nowrap;
}
.option-remove-btn:hover { background: var(--red); color: white; }
.option-remove-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== CONFIRM DIALOG ===== */
.confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(13,61,46,0.5);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.confirm-overlay.open { opacity: 1; pointer-events: all; }
.confirm-box {
  background: white;
  border-radius: var(--radius);
  padding: 26px;
  max-width: 320px;
  width: 100%;
  text-align: center;
  box-shadow: var(--shadow-lg);
  transform: scale(0.9);
  transition: transform 0.2s;
}
.confirm-overlay.open .confirm-box { transform: scale(1); }

/* ===== LOADING ===== */
.loading { display: flex; align-items: center; justify-content: center; padding: 50px; flex-direction: column; gap: 12px; color: var(--muted); }
.spinner { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--primary-dark);
  color: white;
  padding: 11px 18px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  z-index: 999;
  transform: translateY(80px);
  transition: transform 0.3s;
  box-shadow: var(--shadow-lg);
}
.toast.show { transform: translateY(0); }
.toast.error { background: var(--red); }

/* ===== EMPTY STATE ===== */
.empty-state { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty-state .icon { font-size: 42px; display: block; margin-bottom: 10px; }

/* ===== NOTE BOX ===== */
.note-box { background: #f0f7f4; border-left: 3px solid var(--primary); padding: 10px 14px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 13px; color: var(--muted); }

/* ===== MOBILE ===== */
.mobile-toggle { display: none; position: fixed; top: 12px; left: 12px; z-index: 300; background: var(--primary-dark); color: white; border: none; border-radius: var(--radius-sm); padding: 9px 11px; font-size: 18px; cursor: pointer; }
.overlay-close { display: none; }
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; padding: 14px; padding-top: 56px; }
  .mobile-toggle { display: block; }
  .overlay-close { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
  .form-row { grid-template-columns: 1fr; }
  .patient-grid { grid-template-columns: 1fr; }
  .login-card { padding: 32px 22px; }
  .profile-header { flex-direction: column; }
}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <h1>Physiclinic</h1>
      <p>PT Patient Archive — Ortho</p>
    </div>
    <div class="login-error" id="login-error"></div>
    <div class="form-group" style="margin-bottom:12px">
      <label class="form-label">Email</label>
      <input class="form-control" type="email" id="login-email" placeholder="your@email.com" onkeydown="if(event.key==='Enter')loginSubmit()">
    </div>
    <div class="form-group" style="margin-bottom:22px">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')loginSubmit()">
    </div>
    <button class="btn btn-primary" id="login-btn" style="width:100%;justify-content:center;padding:12px" onclick="loginSubmit()">Sign In →</button>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app-screen">
  <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
  <div class="overlay-close" id="overlay-close" onclick="toggleSidebar()"></div>
  <div class="app-wrap">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <h2>Physiclinic</h2>
        <small>PT Patient Archive</small>
      </div>
      <div class="sidebar-user">
        <strong id="user-name">...</strong>
        <small id="user-role">...</small>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" id="nav-patients">👥 Patients</button>
        <button class="nav-item" id="nav-manage">⚙️ Manage Options</button>
        <button class="nav-item" id="nav-users">👤 Manage Users</button>
      </nav>
      <div class="sidebar-footer">

<!-- ===== FIREBASE + APP LOGIC ===== -->
<script type="module">
// ─────────────────────────────────────────
// FIREBASE SETUP
// ─────────────────────────────────────────
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore,
  collection, doc,
  getDoc, getDocs,
  setDoc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const fbApp = initializeApp({
  apiKey: "AIzaSyBV6--Y8VTOIm0XhU1h-6GSJmJiWwbBMd8",
  authDomain: "physiclinic-4a8d1.firebaseapp.com",
  projectId: "physiclinic-4a8d1",
  storageBucket: "physiclinic-4a8d1.firebasestorage.app",
  messagingSenderId: "581907813652",
  appId: "1:581907813652:web:c203369bb92e63d01b1e01"
});
const AUTH = getAuth(fbApp);
const DB   = getFirestore(fbApp);

// ─────────────────────────────────────────
// APP STATE
// ─────────────────────────────────────────
let currentUser = null;   // { uid, email, name, role }
let patients    = [];     // realtime list
let manageTab   = 'regions';
let manageSelRegion = '';

// Assessment editing state
let assessPid    = '';
let assessType   = '';   // 'initial' | 'followup'
let assessFuId   = null;
let assessDate   = '';
let assessRegions = [];  // array of region objects
let assessActiveRegion = 0;
let assessDuration = '';
let assessOnset  = '';
let assessNotes  = '';

// ─────────────────────────────────────────
// OPTIONS — always read fresh from Firestore
// ─────────────────────────────────────────
async function readOptions() {
  const snap = await getDoc(doc(DB, 'config', 'options'));
  return snap.exists() ? snap.data() : getDefaultOptions();
}

async function writeOptions(opts) {
  await setDoc(doc(DB, 'config', 'options'), opts);
}

// ─────────────────────────────────────────
// AUTH
// ─────────────────────────────────────────
window.loginSubmit = async function() {
  const btn   = document.getElementById('login-btn');
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  btn.textContent = 'Signing in...';
  btn.disabled = true;
  try {
    await signInWithEmailAndPassword(AUTH, email, pass);
  } catch(e) {
    errEl.textContent = 'Invalid email or password';
    errEl.style.display = 'block';
    btn.textContent = 'Sign In →';
    btn.disabled = false;
  }
};

window.logoutSubmit = async function() {
  await signOut(AUTH);
  patients = [];
  currentUser = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-email').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-error').style.display = 'none';
};

onAuthStateChanged(AUTH, async (user) => {
  if (!user) return;

  // Load user profile
  const snap = await getDoc(doc(DB, 'users', user.uid));
  if (snap.exists()) {
    currentUser = { uid: user.uid, email: user.email, ...snap.data() };
  } else {
    currentUser = { uid: user.uid, email: user.email, name: user.email, role: 'doctor' };
    await setDoc(doc(DB, 'users', user.uid), {
      name: user.email, role: 'doctor', email: user.email
    });
  }

  // Show app
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('user-name').textContent = currentUser.name || currentUser.email;
  document.getElementById('user-role').textContent = currentUser.role === 'doctor' ? '👨‍⚕️ Doctor' : '🗂️ Receptionist';

  // Setup nav based on role
  setupNav();

  // Start patients listener
  startPatientsListener();
});

function setupNav() {
  const isDoctor = currentUser.role === 'doctor';

  document.getElementById('nav-patients').addEventListener('click', () => showPage('patients'));

  if (isDoctor) {
    document.getElementById('nav-manage').addEventListener('click', () => showPage('manage'));
    document.getElementById('nav-users').addEventListener('click', () => showPage('users'));
    document.getElementById('btn-export-all').style.display = '';
  } else {
    document.getElementById('nav-manage').classList.add('disabled');
    document.getElementById('nav-users').classList.add('disabled');
    document.getElementById('btn-export-all').style.display = 'none';
  }
}

// ─────────────────────────────────────────
// PATIENTS REALTIME
// ─────────────────────────────────────────
function startPatientsListener() {
  const q = query(collection(DB, 'patients'), orderBy('createdAt', 'desc'));
  onSnapshot(q, (snap) => {
    patients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderPatientList();
  });
}

function renderPatientList() {
  const searchVal = (document.getElementById('search-input')?.value || '').toLowerCase();
  const filtered = patients.filter(p => {
    const text = p.name + ' ' +
      (p.visits || []).flatMap(v =>
        (v.regions || []).map(r => r.region + ' ' + (r.diagnoses || []).join(' '))
      ).join(' ');
    return text.toLowerCase().includes(searchVal);
  });

  document.getElementById('patient-count').textContent = `${patients.length} patient${patients.length !== 1 ? 's' : ''}`;

  const grid = document.getElementById('patient-grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <span class="icon">👥</span>
      <h3>${searchVal ? 'No results found' : 'No patients yet'}</h3>
      <p>${searchVal ? 'Try a different search' : 'Click New Patient to get started'}</p>
    </div>`;
    return;
  }

  grid.innerHTML = '';
  const isDoctor = currentUser.role === 'doctor';
  filtered.forEach(p => {
    const initial = (p.visits || []).find(v => v.type === 'initial');
    const followups = (p.visits || []).filter(v => v.type === 'followup');
    const regions = (initial?.regions || []).map(r => r.region).join(', ');

    const card = document.createElement('div');
    card.className = 'patient-card';
    card.innerHTML = `
      <div class="patient-name">${p.name}</div>
      <span class="status-badge ${initial ? 'status-complete' : 'status-pending'}">
        ${initial ? '✅ Complete' : '⏳ Pending'}
      </span>
      <div class="patient-meta">
        <span>👤 ${p.age} y/o — ${p.gender || ''}${p.job ? ' · ' + p.job : ''}</span>
        ${p.phone ? `<span>📞 ${p.phone}</span>` : ''}
        ${regions ? `<span>📍 ${regions}</span>` : ''}
        ${initial ? `<span>📅 ${initial.date}</span>` : ''}
        ${followups.length ? `<span>🔄 ${followups.length} follow-up${followups.length > 1 ? 's' : ''}</span>` : ''}
      </div>
      <div class="patient-actions"></div>
    `;

    const actions = card.querySelector('.patient-actions');

    // View button
    const viewBtn = document.createElement('button');
    viewBtn.className = 'btn btn-primary btn-sm';
    viewBtn.textContent = '📋 View';
    viewBtn.addEventListener('click', () => openProfile(p.id));
    actions.appendChild(viewBtn);

    if (isDoctor) {
      // Assessment button
      const assessBtn = document.createElement('button');
      assessBtn.className = 'btn btn-ghost btn-sm';
      assessBtn.textContent = '✏️ Assessment';
      assessBtn.addEventListener('click', () => openAssessment(p.id, 'initial'));
      actions.appendChild(assessBtn);

      // Delete button
      const delBtn = document.createElement('button');
      delBtn.className = 'btn btn-danger btn-sm';
      delBtn.textContent = '🗑️';
      delBtn.addEventListener('click', () => confirmAction(
        'Delete Patient',
        `Delete "${p.name}"? This cannot be undone.`,
        async () => { await deleteDoc(doc(DB, 'patients', p.id)); showToast('Patient deleted'); }
      ));
      actions.appendChild(delBtn);
    }

    grid.appendChild(card);
  });
}

// ─────────────────────────────────────────
// NEW PATIENT
// ─────────────────────────────────────────
document.getElementById('btn-new-patient').addEventListener('click', () => {
  document.getElementById('pt-name').value = '';
  document.getElementById('pt-age').value = '';
  document.getElementById('pt-job').value = '';
  document.getElementById('pt-phone').value = '';
  document.getElementById('pt-gender').value = 'Male';
  openModal('modal-new-patient');
});
document.getElementById('close-new-patient').addEventListener('click', () => closeModal('modal-new-patient'));
document.getElementById('cancel-new-patient').addEventListener('click', () => closeModal('modal-new-patient'));

document.getElementById('save-new-patient').addEventListener('click', async () => {
  const name = document.getElementById('pt-name').value.trim();
  const age  = document.getElementById('pt-age').value.trim();
  if (!name || !age) { showToast('Name and age are required', true); return; }
  try {
    const ref = await addDoc(collection(DB, 'patients'), {
      name, age,
      gender: document.getElementById('pt-gender').value,
      job:    document.getElementById('pt-job').value.trim(),
      phone:  document.getElementById('pt-phone').value.trim(),
      createdAt: Date.now(),
      createdBy: currentUser.uid,
      visits: []
    });
    closeModal('modal-new-patient');
    showToast('Patient added ✅');
    if (currentUser.role === 'doctor') setTimeout(() => openAssessment(ref.id, 'initial'), 300);
  } catch(e) { showToast('Error: ' + e.message, true); }
});

// search
document.getElementById('search-input').addEventListener('input', renderPatientList);

// ─────────────────────────────────────────
// ASSESSMENT MODAL
// ─────────────────────────────────────────
window.openAssessment = async function openAssessment(pid, type, fuId = null) {
  if (currentUser.role !== 'doctor') { showToast('Doctor access only', true); return; }

  assessPid   = pid;
  assessType  = type;
  assessFuId  = fuId;

  const p = patients.find(x => x.id === pid);
  if (!p) return;

  // Load existing data if editing
  let existing = null;
  if (type === 'initial') {
    existing = (p.visits || []).find(v => v.type === 'initial') || null;
  } else if (fuId) {
    existing = (p.visits || []).find(v => v.id === fuId) || null;
  }

  if (existing) {
    assessDate     = existing.date || todayStr();
    assessRegions  = JSON.parse(JSON.stringify(existing.regions || []));
    assessDuration = existing.duration || '';
    assessOnset    = existing.onset || '';
    assessNotes    = existing.notes || '';
  } else {
    assessDate     = todayStr();
    assessDuration = '';
    assessOnset    = '';
    assessNotes    = '';
    if (type === 'followup') {
      const ini = (p.visits || []).find(v => v.type === 'initial');
      assessRegions = (ini?.regions || []).map(r => ({
        region: r.region,
        diagnoses: [], complaints: [], findings: [], problems: [], treatment: [],
        vas: null, sessionsPlanned: '', freq: ''
      }));
    } else {
      assessRegions = [];
    }
  }

  assessActiveRegion = 0;

  const label = type === 'initial' ? 'Initial Assessment' : 'Follow-up';
  document.getElementById('assess-title').textContent = `${label} — ${p.name}`;
  document.getElementById('assess-body').innerHTML = `<div class="loading"><div class="spinner"></div><span>Loading options...</span></div>`;

  openModal('modal-assess');

  const opts = await readOptions();
  buildAssessmentForm(opts);
}

function buildAssessmentForm(opts) {
  const body = document.getElementById('assess-body');
  body.innerHTML = '';

  // Date
  const dateInp = makeInput('assess-date', 'date', assessDate);
  dateInp.addEventListener('change', e => assessDate = e.target.value);
  const dateGroup = makeFormGroup('Date', dateInp);
  body.appendChild(dateGroup);

  // Region tabs
  const tabsWrap = document.createElement('div');
  tabsWrap.className = 'region-tabs';
  tabsWrap.id = 'region-tabs';

  assessRegions.forEach((r, i) => {
    tabsWrap.appendChild(makeRegionTab(r.region, i));
  });

  const addTabBtn = document.createElement('button');
  addTabBtn.className = 'region-tab-add';
  addTabBtn.textContent = '+ Add Region';
  addTabBtn.addEventListener('click', () => showRegionPicker(opts));
  tabsWrap.appendChild(addTabBtn);
  body.appendChild(tabsWrap);

  // Region panels
  const panelsWrap = document.createElement('div');
  panelsWrap.id = 'region-panels';
  assessRegions.forEach((r, i) => {
    panelsWrap.appendChild(buildRegionPanel(r, i, opts));
  });
  body.appendChild(panelsWrap);

  if (!assessRegions.length) {
    const hint = document.createElement('p');
    hint.style.cssText = 'font-size:13px;color:var(--muted);padding:18px;text-align:center';
    hint.textContent = 'Click "+ Add Region" to start the assessment';
    panelsWrap.appendChild(hint);
  }

  // Duration & Onset
  body.appendChild(makeSectionHeader('⏱ Duration & Onset'));
  const durRow = document.createElement('div');
  durRow.className = 'form-row';
  durRow.appendChild(makeFormGroup('Duration', makeInput('assess-duration', 'text', assessDuration, 'e.g. 3 months')));
  durRow.appendChild(makeFormGroup('Onset', makeSelect('assess-onset',
    ['', 'Gradual', 'Sudden', 'Post-trauma', 'Post-surgical', 'Post-exercise', 'Unknown'],
    assessOnset
  )));
  body.appendChild(durRow);

  // Notes
  body.appendChild(makeSectionHeader('📝 Notes'));
  const ta = document.createElement('textarea');
  ta.className = 'form-control';
  ta.id = 'assess-notes';
  ta.rows = 3;
  ta.placeholder = 'Clinical notes...';
  ta.value = assessNotes;
  body.appendChild(ta);

  // Activate first tab
  if (assessRegions.length > 0) activateRegionTab(0);
}

function makeRegionTab(name, idx) {
  const btn = document.createElement('button');
  btn.className = 'region-tab' + (idx === assessActiveRegion ? ' active' : '');
  btn.textContent = name;
  btn.dataset.idx = idx;
  btn.addEventListener('click', () => activateRegionTab(idx));
  return btn;
}

function activateRegionTab(idx) {
  assessActiveRegion = idx;
  document.querySelectorAll('.region-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.region-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
}

function buildRegionPanel(rd, idx, opts) {
  const panel = document.createElement('div');
  panel.className = 'region-panel' + (idx === assessActiveRegion ? ' active' : '');

  // Remove region button
  const removeBtn = document.createElement('button');
  removeBtn.className = 'btn btn-danger btn-sm';
  removeBtn.style.marginBottom = '12px';
  removeBtn.textContent = `🗑️ Remove ${rd.region}`;
  removeBtn.addEventListener('click', () => removeRegion(idx, opts));
  panel.appendChild(removeBtn);

  const r = rd.region;
  const sections = [
    ['🩺 Diagnosis',          'diagnoses',  opts.diagnoses[r]  || []],
    ['💬 Chief Complaints',   'complaints', opts.complaints[r] || []],
    ['🔬 Assessment Findings','findings',   opts.findings[r]   || []],
    ['📌 Problem List',       'problems',   opts.problems],
    ['💊 Treatment Plan',     'treatment',  opts.treatment[r]  || []],
  ];

  sections.forEach(([title, key, allOpts]) => {
    panel.appendChild(makeSectionHeader(title));
    panel.appendChild(buildPillSection(key, allOpts, rd[key] || [], key === 'problems' ? null : r, opts, idx));
  });

  // VAS
  panel.appendChild(makeSectionHeader('😣 Pain Level — VAS (0–10)'));
  panel.appendChild(buildVas(rd.vas, idx));

  // Sessions
  panel.appendChild(makeSectionHeader('📅 Session Plan'));
  const sessRow = document.createElement('div');
  sessRow.className = 'form-row';
  sessRow.appendChild(makeFormGroup('Sessions Planned', makeInput(`sess-${idx}`, 'number', rd.sessionsPlanned || '', 'e.g. 12')));
  sessRow.appendChild(makeFormGroup('Frequency', makeSelect(`freq-${idx}`,
    ['', 'Daily', '3x/week', '2x/week', 'Weekly'], rd.freq || ''
  )));
  panel.appendChild(sessRow);

  return panel;
}

function buildPillSection(key, allOpts, selected, region, opts, regionIdx) {
  const wrap = document.createElement('div');

  // Pills
  const pillGroup = document.createElement('div');
  pillGroup.className = 'pill-group';
  allOpts.forEach(opt => {
    pillGroup.appendChild(makePill(key, opt, selected.includes(opt), regionIdx));
  });
  wrap.appendChild(pillGroup);

  // Add option row
  const addRow = document.createElement('div');
  addRow.className = 'add-option-row';
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = 'Add new option (saves permanently)...';
  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.textContent = '+ Add';
  addBtn.addEventListener('click', async () => {
    const val = inp.value.trim();
    if (!val) { showToast('Please type an option first', true); return; }
    // Save to Firestore
    const freshOpts = await readOptions();
    if (region && freshOpts[key] && Array.isArray(freshOpts[key][region])) {
      if (!freshOpts[key][region].includes(val)) freshOpts[key][region].push(val);
    } else if (key === 'problems') {
      if (!freshOpts.problems.includes(val)) freshOpts.problems.push(val);
    }
    await writeOptions(freshOpts);
    // Add pill to UI
    if (!assessRegions[regionIdx][key]) assessRegions[regionIdx][key] = [];
    if (!assessRegions[regionIdx][key].includes(val)) assessRegions[regionIdx][key].push(val);
    pillGroup.appendChild(makePill(key, val, true, regionIdx));
    inp.value = '';
    showToast('Option added ✅');
  });
  addRow.appendChild(inp);
  addRow.appendChild(addBtn);
  wrap.appendChild(addRow);

  return wrap;
}

function makePill(key, opt, isSelected, regionIdx) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'pill' + (isSelected ? ' selected' : '');
  btn.textContent = opt;
  btn.addEventListener('click', function() {
    if (!assessRegions[regionIdx][key]) assessRegions[regionIdx][key] = [];
    if (assessRegions[regionIdx][key].includes(opt)) {
      assessRegions[regionIdx][key] = assessRegions[regionIdx][key].filter(x => x !== opt);
      this.classList.remove('selected');
    } else {
      assessRegions[regionIdx][key].push(opt);
      this.classList.add('selected');
    }
  });
  return btn;
}

function buildVas(currentVal, regionIdx) {
  const wrap = document.createElement('div');
  wrap.className = 'vas-container';
  for (let i = 0; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'vas-btn' + (currentVal === i ? ' selected' : '');
    btn.textContent = i;
    btn.addEventListener('click', function() {
      assessRegions[regionIdx].vas = i;
      wrap.querySelectorAll('.vas-btn').forEach(b => b.classList.remove('selected'));
      this.classList.add('selected');
    });
    wrap.appendChild(btn);
  }
  return wrap;
}

function showRegionPicker(opts) {
  const existing = assessRegions.map(r => r.region);
  const available = opts.regions.filter(r => !existing.includes(r));
  if (!available.length) { showToast('All regions already added', true); return; }

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(13,61,46,0.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.id = 'region-picker';

  const box = document.createElement('div');
  box.style.cssText = 'background:white;border-radius:14px;padding:22px;max-width:440px;width:100%;box-shadow:0 8px 36px rgba(13,61,46,0.2)';
  box.innerHTML = '<div style="font-size:16px;font-weight:700;color:var(--primary-dark);margin-bottom:14px">Select Region</div>';

  const pillGroup = document.createElement('div');
  pillGroup.className = 'pill-group';
  available.forEach(r => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pill';
    btn.textContent = r;
    btn.addEventListener('click', () => {
      addRegion(r, opts);
      document.getElementById('region-picker')?.remove();
    });
    pillGroup.appendChild(btn);
  });
  box.appendChild(pillGroup);

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-ghost btn-sm';
  cancelBtn.style.marginTop = '14px';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', () => overlay.remove());
  box.appendChild(cancelBtn);

  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function addRegion(name, opts) {
  const newRegion = { region: name, diagnoses: [], complaints: [], findings: [], problems: [], treatment: [], vas: null, sessionsPlanned: '', freq: '' };
  assessRegions.push(newRegion);
  const idx = assessRegions.length - 1;

  const tabsWrap = document.getElementById('region-tabs');
  const addBtn   = tabsWrap.querySelector('.region-tab-add');
  tabsWrap.insertBefore(makeRegionTab(name, idx), addBtn);

  const panelsWrap = document.getElementById('region-panels');
  panelsWrap.appendChild(buildRegionPanel(newRegion, idx, opts));

  activateRegionTab(idx);
}

function removeRegion(idx, opts) {
  assessRegions.splice(idx, 1);
  buildAssessmentForm(opts);
}

// Save assessment
document.getElementById('close-assess').addEventListener('click', () => closeModal('modal-assess'));

document.getElementById('save-assess').addEventListener('click', async () => {
  // Collect form values
  assessDate     = document.getElementById('assess-date')?.value || todayStr();
  assessDuration = document.getElementById('assess-duration')?.value.trim() || '';
  assessOnset    = document.getElementById('assess-onset')?.value || '';
  assessNotes    = document.getElementById('assess-notes')?.value.trim() || '';

  assessRegions.forEach((_, i) => {
    assessRegions[i].sessionsPlanned = document.getElementById(`sess-${i}`)?.value || '';
    assessRegions[i].freq = document.getElementById(`freq-${i}`)?.value || '';
  });

  const visitObj = {
    id:       assessFuId || generateId(),
    type:     assessType,
    date:     assessDate,
    duration: assessDuration,
    onset:    assessOnset,
    notes:    assessNotes,
    regions:  assessRegions,
    savedAt:  Date.now()
  };

  try {
    const p = patients.find(x => x.id === assessPid);
    let visits = [...(p.visits || [])];
    if (assessType === 'initial') {
      const i = visits.findIndex(v => v.type === 'initial');
      if (i >= 0) visits[i] = visitObj;
      else visits.unshift(visitObj);
    } else {
      const i = visits.findIndex(v => v.id === visitObj.id);
      if (i >= 0) visits[i] = visitObj;
      else visits.push(visitObj);
    }
    await updateDoc(doc(DB, 'patients', assessPid), { visits });
    closeModal('modal-assess');
    showToast('Assessment saved ✅');
    openProfile(assessPid);
  } catch(e) { showToast('Error: ' + e.message, true); }
});

window.openProfile = function openProfile(pid) {
  const p = patients.find(x => x.id === pid);
  if (!p) return;

  const isDoctor = currentUser.role === 'doctor';
  const visits = [...(p.visits || [])].sort((a, b) => {
    if (a.type === 'initial') return -1;
    if (b.type === 'initial') return 1;
    return a.date > b.date ? -1 : 1;
  });
  const initial = visits.find(v => v.type === 'initial');

  const page = document.getElementById('page-profile');
  page.innerHTML = '';

  // Back button
  const backBtn = document.createElement('button');
  backBtn.className = 'btn btn-ghost btn-sm';
  backBtn.style.marginBottom = '12px';
  backBtn.textContent = '← Back';
  backBtn.addEventListener('click', () => showPage('patients'));
  page.appendChild(backBtn);

  // Profile header
  const header = document.createElement('div');
  header.className = 'profile-header';
  header.innerHTML = `
    <div>
      <div class="profile-name">${p.name}</div>
      <div style="opacity:0.75;font-size:13px">${p.age} y/o — ${p.gender || ''}${p.job ? ' · ' + p.job : ''}${p.phone ? ' · ' + p.phone : ''}</div>
      <div class="profile-tags">
        ${(initial?.regions || []).map(r => `<span class="profile-tag gold">${r.region}</span>`).join('')}
        ${initial ? `<span class="profile-tag">📅 ${initial.date}</span>` : ''}
        ${visits.filter(v => v.type === 'followup').length ? `<span class="profile-tag">🔄 ${visits.filter(v => v.type === 'followup').length} Follow-up(s)</span>` : ''}
      </div>
    </div>
  `;

  const actions = document.createElement('div');
  actions.style.cssText = 'display:flex;gap:7px;flex-wrap:wrap';
  if (isDoctor) {
    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn-accent btn-sm';
    editBtn.textContent = '✏️ Edit Assessment';
    editBtn.addEventListener('click', () => openAssessment(p.id, 'initial'));
    actions.appendChild(editBtn);

    const fuBtn = document.createElement('button');
    fuBtn.className = 'btn btn-primary btn-sm';
    fuBtn.textContent = '+ Follow-up';
    fuBtn.addEventListener('click', () => openAssessment(p.id, 'followup'));
    actions.appendChild(fuBtn);

    const pdfBtn = document.createElement('button');
    pdfBtn.className = 'btn btn-pdf btn-sm';
    pdfBtn.textContent = '📄 PDF';
    pdfBtn.addEventListener('click', () => exportPDF(p.id));
    actions.appendChild(pdfBtn);

    const csvBtn = document.createElement('button');
    csvBtn.className = 'btn btn-green btn-sm';
    csvBtn.textContent = '📊 CSV';
    csvBtn.addEventListener('click', () => exportCSV(p.id));
    actions.appendChild(csvBtn);
  }
  header.appendChild(actions);
  page.appendChild(header);

  // No assessment
  if (!initial) {
    const empty = document.createElement('div');
    empty.className = 'card';
    empty.style.cssText = 'text-align:center;padding:40px;color:var(--muted)';
    empty.innerHTML = '<div style="font-size:40px;margin-bottom:10px">📋</div><p style="font-weight:600">No assessment yet</p>';
    if (isDoctor) {
      const startBtn = document.createElement('button');
      startBtn.className = 'btn btn-primary';
      startBtn.style.marginTop = '14px';
      startBtn.textContent = 'Start Assessment';
      startBtn.addEventListener('click', () => openAssessment(p.id, 'initial'));
      empty.appendChild(startBtn);
    }
    page.appendChild(empty);
    showPage('profile');
    return;
  }

  // Visits
  visits.forEach(v => {
    const isInit = v.type === 'initial';
    const card = document.createElement('div');
    card.className = 'visit-card' + (isInit ? '' : ' followup');

    // Delete & edit buttons for followups
    if (isDoctor && !isInit) {
      const delBtn = document.createElement('button');
      delBtn.className = 'visit-delete-btn';
      delBtn.textContent = '🗑️';
      delBtn.addEventListener('click', () => confirmAction(
        'Delete Follow-up',
        'Delete this follow-up? Cannot be undone.',
        async () => {
          const pt = patients.find(x => x.id === p.id);
          await updateDoc(doc(DB, 'patients', p.id), {
            visits: (pt.visits || []).filter(x => x.id !== v.id)
          });
          showToast('Deleted');
          openProfile(p.id);
        }
      ));
      card.appendChild(delBtn);

      const editBtn = document.createElement('button');
      editBtn.className = 'visit-edit-btn';
      editBtn.textContent = '✏️ Edit';
      editBtn.addEventListener('click', () => openAssessment(p.id, 'followup', v.id));
      card.appendChild(editBtn);
    }

    // Visit header
    const visitHead = document.createElement('div');
    visitHead.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px';
    const badge = document.createElement('span');
    badge.className = 'visit-type-badge ' + (isInit ? 'initial' : 'followup');
    badge.textContent = isInit ? '📋 Initial Assessment' : '🔄 Follow-up';
    visitHead.appendChild(badge);
    const dateSpan = document.createElement('span');
    dateSpan.style.cssText = 'font-size:12px;font-weight:600;color:var(--muted)';
    dateSpan.textContent = '📅 ' + v.date;
    visitHead.appendChild(dateSpan);
    if (v.duration) {
      const durSpan = document.createElement('span');
      durSpan.style.cssText = 'font-size:12px;color:var(--muted)';
      durSpan.textContent = `⏱ ${v.duration}${v.onset ? ' — ' + v.onset : ''}`;
      visitHead.appendChild(durSpan);
    }
    card.appendChild(visitHead);

    // Regions
    (v.regions || []).forEach(r => {
      const regionCard = document.createElement('div');
      regionCard.className = 'region-card';

      const regionTitle = document.createElement('div');
      regionTitle.className = 'region-card-title';
      regionTitle.textContent = '📍 ' + r.region;
      if (r.sessionsPlanned) {
        const sessSpan = document.createElement('span');
        sessSpan.style.cssText = 'font-size:11px;color:var(--muted);font-weight:400;margin-left:8px';
        sessSpan.textContent = `💪 ${r.sessionsPlanned}${r.freq ? ' · ' + r.freq : ''}`;
        regionTitle.appendChild(sessSpan);
      }
      regionCard.appendChild(regionTitle);

      const renderTags = (title, arr, cls) => {
        if (!arr?.length) return;
        const sec = document.createElement('div');
        sec.className = 'data-section';
        const ttl = document.createElement('div');
        ttl.className = 'data-section-title';
        ttl.textContent = title;
        const tags = document.createElement('div');
        tags.className = 'data-tags';
        arr.forEach(x => {
          const tag = document.createElement('span');
          tag.className = 'data-tag' + (cls ? ' ' + cls : '');
          tag.textContent = x;
          tags.appendChild(tag);
        });
        sec.appendChild(ttl);
        sec.appendChild(tags);
        regionCard.appendChild(sec);
      };

      renderTags('🩺 Diagnosis', r.diagnoses, 'diagnosis');
      renderTags('💬 Complaints', r.complaints, '');

      // VAS
      if (r.vas != null) {
        const c = r.vas <= 3 ? '#27ae60' : r.vas <= 6 ? '#e8a020' : '#d94f4f';
        const vasSec = document.createElement('div');
        vasSec.className = 'data-section';
        vasSec.innerHTML = `<div class="data-section-title">😣 VAS</div>
          <div style="display:inline-flex;align-items:center;gap:8px;background:var(--bg);padding:6px 14px;border-radius:22px">
            <span style="font-size:22px;font-weight:700;color:${c}">${r.vas}</span>
            <span style="color:var(--muted);font-size:12px">/10</span>
            <div style="height:5px;width:90px;background:#ddd;border-radius:5px;overflow:hidden">
              <div style="height:100%;width:${r.vas * 10}%;background:${c}"></div>
            </div>
          </div>`;
        regionCard.appendChild(vasSec);
      }

      renderTags('🔬 Findings', r.findings, '');
      renderTags('📌 Problem List', r.problems, 'problem');
      renderTags('💊 Treatment', r.treatment, '');

      card.appendChild(regionCard);
    });

    if (v.notes) {
      const notesDiv = document.createElement('div');
      notesDiv.style.cssText = 'font-size:13px;background:var(--bg);padding:10px;border-radius:var(--radius-sm);margin-top:8px';
      notesDiv.textContent = v.notes;
      card.appendChild(notesDiv);
    }

    page.appendChild(card);
  });

  showPage('profile');
}

async function renderManage() {
  const card = document.getElementById('manage-card');
  // Clear all children
  while (card.firstChild) card.removeChild(card.firstChild);

  // Load fresh options every time
  const opts = await readOptions();

  // Tab bar
  const TABS = ['regions', 'diagnoses', 'complaints', 'findings', 'treatment', 'problems'];
  const LABELS = { regions: 'Regions', diagnoses: 'Diagnoses', complaints: 'Complaints', findings: 'Findings', treatment: 'Treatment', problems: 'Problem List' };

  const tabBar = document.createElement('div');
  tabBar.className = 'manage-tabs';
  TABS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'manage-tab' + (manageTab === t ? ' active' : '');
    btn.textContent = LABELS[t];
    btn.addEventListener('click', () => {
      manageTab = t;
      renderManage();
    });
    tabBar.appendChild(btn);
  });
  card.appendChild(tabBar);

  // Content based on tab
  if (manageTab === 'regions' || manageTab === 'problems') {
    const items = manageTab === 'regions' ? opts.regions : opts.problems;

    // List items
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'option-item';

      const span = document.createElement('span');
      span.textContent = item;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'option-remove-btn';
      removeBtn.textContent = '✕ Remove';

      // THIS IS THE KEY: use closure to capture item value
      removeBtn.addEventListener('click', async function() {
        const capturedItem = item; // explicitly capture
        this.disabled = true;
        this.textContent = 'Removing...';
        try {
          const freshOpts = await readOptions();
          if (manageTab === 'regions') {
            freshOpts.regions = freshOpts.regions.filter(x => x !== capturedItem);
          } else {
            freshOpts.problems = freshOpts.problems.filter(x => x !== capturedItem);
          }
          await writeOptions(freshOpts);
          showToast(capturedItem + ' removed ✅');
          await renderManage(); // re-render with fresh data
        } catch(e) {
          showToast('Error: ' + e.message, true);
          this.disabled = false;
          this.textContent = '✕ Remove';
        }
      });

      row.appendChild(span);
      row.appendChild(removeBtn);
      card.appendChild(row);
    });

    // Add input
    const addRow = document.createElement('div');
    addRow.className = 'add-option-row';
    addRow.style.marginTop = '12px';
    const addInp = document.createElement('input');
    addInp.type = 'text';
    addInp.placeholder = manageTab === 'regions' ? 'New region name...' : 'New problem...';
    const addBtn = document.createElement('button');
    addBtn.textContent = '+ Add';
    addBtn.addEventListener('click', async () => {
      const val = addInp.value.trim();
      if (!val) return;
      const freshOpts = await readOptions();
      if (manageTab === 'regions') {
        if (!freshOpts.regions.includes(val)) {
          freshOpts.regions.push(val);
          ['diagnoses', 'complaints', 'findings', 'treatment'].forEach(k => {
            freshOpts[k][val] = [];
          });
        }
      } else {
        if (!freshOpts.problems.includes(val)) freshOpts.problems.push(val);
      }
      await writeOptions(freshOpts);
      showToast('Added ✅');
      await renderManage();
    });
    addRow.appendChild(addInp);
    addRow.appendChild(addBtn);
    card.appendChild(addRow);

  } else {
    // Region-based tabs
    if (!manageSelRegion && opts.regions.length > 0) manageSelRegion = opts.regions[0];

    // Region selector
    const selWrap = document.createElement('div');
    selWrap.style.marginBottom = '12px';
    const selLabel = document.createElement('label');
    selLabel.className = 'form-label';
    selLabel.style.cssText = 'display:block;margin-bottom:5px';
    selLabel.textContent = 'Region';
    const sel = document.createElement('select');
    sel.className = 'form-control';
    sel.style.width = 'auto';
    opts.regions.forEach(r => {
      const op = document.createElement('option');
      op.value = r;
      op.textContent = r;
      if (r === manageSelRegion) op.selected = true;
      sel.appendChild(op);
    });
    sel.addEventListener('change', () => {
      manageSelRegion = sel.value;
      renderManage();
    });
    selWrap.appendChild(selLabel);
    selWrap.appendChild(sel);
    card.appendChild(selWrap);

    const items = (opts[manageTab] && opts[manageTab][manageSelRegion]) ? opts[manageTab][manageSelRegion] : [];
    const capturedRegion = manageSelRegion;
    const capturedTab = manageTab;

    // List items
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'option-item';

      const span = document.createElement('span');
      span.textContent = item;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'option-remove-btn';
      removeBtn.textContent = '✕ Remove';

      // Capture all values in closure
      const capturedItem   = item;
      const capturedRegion2 = capturedRegion;
      const capturedTab2    = capturedTab;

      removeBtn.addEventListener('click', async function() {
        this.disabled = true;
        this.textContent = 'Removing...';
        try {
          const freshOpts = await readOptions();
          if (freshOpts[capturedTab2] && freshOpts[capturedTab2][capturedRegion2]) {
            freshOpts[capturedTab2][capturedRegion2] = freshOpts[capturedTab2][capturedRegion2].filter(x => x !== capturedItem);
          }
          await writeOptions(freshOpts);
          showToast(capturedItem + ' removed ✅');
          await renderManage();
        } catch(e) {
          showToast('Error: ' + e.message, true);
          this.disabled = false;
          this.textContent = '✕ Remove';
        }
      });

      row.appendChild(span);
      row.appendChild(removeBtn);
      card.appendChild(row);
    });

    // Add input
    const addRow = document.createElement('div');
    addRow.className = 'add-option-row';
    addRow.style.marginTop = '10px';
    const addInp = document.createElement('input');
    addInp.type = 'text';
    addInp.placeholder = 'Add new option...';
    const addBtn = document.createElement('button');
    addBtn.textContent = '+ Add';
    addBtn.addEventListener('click', async () => {
      const val = addInp.value.trim();
      if (!val) return;
      const freshOpts = await readOptions();
      if (!freshOpts[manageTab][manageSelRegion]) freshOpts[manageTab][manageSelRegion] = [];
      if (!freshOpts[manageTab][manageSelRegion].includes(val)) freshOpts[manageTab][manageSelRegion].push(val);
      await writeOptions(freshOpts);
      showToast('Added ✅');
      await renderManage();
    });
    addRow.appendChild(addInp);
    addRow.appendChild(addBtn);
    card.appendChild(addRow);
  }
}

window.exportPDF = async function(pid) {
  const p = patients.find(x => x.id === pid);
  if (!p) return;
  showToast('Generating PDF...');

  const visits = [...(p.visits || [])].sort((a, b) => {
    if (a.type === 'initial') return -1;
    if (b.type === 'initial') return 1;
    return a.date > b.date ? -1 : 1;
  });

  const pill = (x, bg, bc, tc) => `<span style="background:${bg};border:1px solid ${bc};padding:3px 9px;border-radius:12px;font-size:11px;color:${tc};display:inline-block;margin:2px">${x}</span>`;
  const sec  = (t, arr, type = '') => arr?.length ? `<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:700;color:#1a5c4a;text-transform:uppercase;margin-bottom:4px">${t}</div><div>${arr.map(x => type === 'dx' ? pill(x, '#eafaf1', '#27ae60', '#1a6b40') : type === 'prob' ? pill(x, '#fdeaea', '#d94f4f', '#d94f4f') : pill(x, '#eef2f0', '#ccddd6', '#162820')).join('')}</div></div>` : '';

  let html = `<div style="font-family:Arial,sans-serif;padding:24px;max-width:700px;color:#162820">
    <div style="border-bottom:3px solid #0d3d2e;padding-bottom:12px;margin-bottom:16px">
      <div style="font-size:18px;font-weight:700;color:#0d3d2e">PT Assessment Report</div>
      <div style="font-size:14px;font-weight:700;margin-top:3px">${p.name}</div>
      <div style="font-size:12px;color:#5a7a6e;margin-top:1px">${p.age} y/o ${p.gender || ''} ${p.job ? '· ' + p.job : ''} ${p.phone ? '· ' + p.phone : ''}</div>
    </div>`;

  visits.forEach(v => {
    const isInit = v.type === 'initial';
    html += `<div style="margin-bottom:18px;border-left:3px solid ${isInit ? '#1a5c4a' : '#e8a020'};padding-left:12px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <span style="background:${isInit ? '#eafaf1' : '#fff3cd'};color:${isInit ? '#27ae60' : '#b07a00'};padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700">${isInit ? 'Initial Assessment' : 'Follow-up'}</span>
        <span style="font-size:12px;font-weight:600;color:#5a7a6e">📅 ${v.date}</span>
        ${v.duration ? `<span style="font-size:11px;color:#5a7a6e">⏱ ${v.duration}${v.onset ? ' — ' + v.onset : ''}</span>` : ''}
      </div>`;
    (v.regions || []).forEach(r => {
      html += `<div style="background:#f8faf9;border-radius:7px;padding:12px;margin-bottom:8px;border-right:3px solid #1a5c4a">
        <div style="font-weight:700;color:#0d3d2e;font-size:12px;margin-bottom:8px">📍 ${r.region}${r.sessionsPlanned ? ` <span style="font-size:10px;color:#5a7a6e;font-weight:400">— ${r.sessionsPlanned} sessions${r.freq ? ' · ' + r.freq : ''}</span>` : ''}</div>
        ${sec('Diagnosis', r.diagnoses, 'dx')}
        ${sec('Chief Complaints', r.complaints)}
        ${r.vas != null ? `<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:700;color:#1a5c4a;text-transform:uppercase;margin-bottom:3px">VAS</div><span style="font-size:20px;font-weight:700;color:${r.vas <= 3 ? '#27ae60' : r.vas <= 6 ? '#e8a020' : '#d94f4f'}">${r.vas}/10</span></div>` : ''}
        ${sec('Assessment Findings', r.findings)}
        ${sec('Problem List', r.problems, 'prob')}
        ${sec('Treatment Plan', r.treatment)}
      </div>`;
    });
    if (v.notes) html += `<div style="font-size:11px;color:#5a7a6e;padding:6px 10px;background:#f8faf9;border-radius:5px;margin-top:4px">📝 ${v.notes}</div>`;
    html += `</div>`;
  });

  html += `<div style="margin-top:20px;padding-top:10px;border-top:1px solid #d0e4de;font-size:10px;color:#5a7a6e;text-align:center">Physiclinic PT Archive · ${todayStr()}</div></div>`;

  const div = document.createElement('div');
  div.innerHTML = html;
  div.style.cssText = 'position:fixed;left:-9999px;top:0;background:white;width:700px;z-index:-1';
  document.body.appendChild(div);

  try {
    const canvas = await html2canvas(div, { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pW  = pdf.internal.pageSize.getWidth() - 20;
    const pH  = pdf.internal.pageSize.getHeight() - 20;
    const iH  = (canvas.height * pW) / canvas.width;
    let srcY  = 0, page = 0;
    while (srcY < iH) {
      if (page > 0) pdf.addPage();
      const sliceH = Math.min(pH, iH - srcY);
      const sc = document.createElement('canvas');
      sc.width  = canvas.width;
      sc.height = Math.round((sliceH / iH) * canvas.height);
      sc.getContext('2d').drawImage(canvas, 0, Math.round((srcY / iH) * canvas.height), canvas.width, sc.height, 0, 0, canvas.width, sc.height);
      pdf.addImage(sc.toDataURL('image/jpeg', 0.92), 'JPEG', 10, 10, pW, sliceH);
      srcY += sliceH;
      page++;
    }
    pdf.save(`PT_${p.name.replace(/\s+/g, '_')}_${todayStr()}.pdf`);
    showToast('PDF downloaded ✅');
  } catch(e) {
    showToast('PDF error: ' + e.message, true);
  } finally {
    document.body.removeChild(div);
  }
};

// CSV EXPORT
// ─────────────────────────────────────────
function csvEsc(v) {
  if (v == null || v === '') return '';
  const s = String(v).replace(/\r\n|\r|\n/g, ' ');
  return s.includes(',') || s.includes('"') ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvDownload(filename, rows) {
  const csv  = rows.map(r => r.map(csvEsc).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const a    = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => document.body.removeChild(a), 1000);
}

window.exportCSV = function(pid) {
  const p = patients.find(x => x.id === pid);
  if (!p) return;
  const visits = [...(p.visits || [])].sort((a, b) => {
    if (a.type === 'initial') return -1;
    if (b.type === 'initial') return 1;
    return a.date > b.date ? 1 : -1;
  });
  const headers = ['Patient','Age','Gender','Job','Phone','Visit Type','Date','Duration','Onset','Region','Diagnosis','Complaints','VAS','Findings','Problems','Treatment','Sessions','Frequency','Notes'];
  const rows = [headers];
  visits.forEach((v, vi) => {
    (v.regions || []).forEach((r, ri) => {
      rows.push([
        vi === 0 && ri === 0 ? p.name  : '',
        vi === 0 && ri === 0 ? p.age   : '',
        vi === 0 && ri === 0 ? p.gender : '',
        vi === 0 && ri === 0 ? p.job   : '',
        vi === 0 && ri === 0 ? p.phone : '',
        ri === 0 ? (v.type === 'initial' ? 'Initial Assessment' : 'Follow-up ' + vi) : '',
        ri === 0 ? v.date     : '',
        ri === 0 ? (v.duration || '') : '',
        ri === 0 ? (v.onset   || '') : '',
        r.region,
        (r.diagnoses  || []).join(' | '),
        (r.complaints || []).join(' | '),
        r.vas != null ? r.vas + '/10' : '',
        (r.findings   || []).join(' | '),
        (r.problems   || []).join(' | '),
        (r.treatment  || []).join(' | '),
        r.sessionsPlanned || '',
        r.freq || '',
        ri === 0 ? (v.notes || '') : ''
      ]);
    });
  });
  csvDownload(`PT_${p.name.replace(/\s+/g, '_')}_${todayStr()}.csv`, rows);
  showToast('CSV downloaded ✅');
};

document.getElementById('btn-export-all').addEventListener('click', () => {
  if (!patients.length) { showToast('No patients to export', true); return; }
  const headers = ['Name','Age','Gender','Job','Phone','Visit Type','Date','Region','Diagnosis','VAS','Complaints','Findings','Problems','Treatment'];
  const rows = [headers];
  patients.forEach(p => {
    if (!(p.visits || []).length) {
      rows.push([p.name, p.age, p.gender, p.job, p.phone, 'No assessment', '', '', '', '', '', '', '', '']);
      return;
    }
    p.visits.forEach((v, vi) => {
      (v.regions || []).forEach((r, ri) => {
        rows.push([
          vi === 0 && ri === 0 ? p.name  : '',
          vi === 0 && ri === 0 ? p.age   : '',
          vi === 0 && ri === 0 ? p.gender : '',
          vi === 0 && ri === 0 ? p.job   : '',
          vi === 0 && ri === 0 ? p.phone : '',
          ri === 0 ? (v.type === 'initial' ? 'Initial' : 'Follow-up ' + vi) : '',
          ri === 0 ? v.date : '',
          r.region,
          (r.diagnoses  || []).join(' | '),
          r.vas != null ? r.vas + '/10' : '',
          (r.complaints || []).join(' | '),
          (r.findings   || []).join(' | '),
          (r.problems   || []).join(' | '),
          (r.treatment  || []).join(' | ')
        ]);
      });
    });
  });
  csvDownload(`Physiclinic_All_${todayStr()}.csv`, rows);
  showToast(`Exported ${patients.length} patients ✅`);
});

window.showPage = function(name) {
  ['patients', 'manage', 'profile', 'users'].forEach(p => {
    document.getElementById('page-' + p).style.display = 'none';
  });
  document.getElementById('page-' + name).style.display = 'block';
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navMap = { patients: 'nav-patients', manage: 'nav-manage', users: 'nav-users' };
  if (navMap[name]) document.getElementById(navMap[name]).classList.add('active');
  if (name === 'manage') renderManage();
  if (name === 'users')  renderUsers();
  closeSidebar();
};

// ─────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function confirmAction(title, message, onConfirm) {
  document.getElementById('confirm-title').textContent   = title;
  document.getElementById('confirm-message').textContent = message;
  document.getElementById('confirm-ok').onclick = async () => {
    closeConfirm();
    await onConfirm();
  };
  document.getElementById('confirm-overlay').classList.add('open');
}
function closeConfirm() { document.getElementById('confirm-overlay').classList.remove('open'); }
document.getElementById('confirm-cancel').addEventListener('click', closeConfirm);

window.toggleSidebar = function() {
  const sidebar = document.getElementById('sidebar');
  const overlay  = document.getElementById('overlay-close');
  sidebar.classList.toggle('open');
  overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
};
function closeSidebar() {
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay-close').style.display = 'none';
  }
}

function todayStr() { return new Date().toISOString().split('T')[0]; }
function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function makeSectionHeader(text) {
  const d = document.createElement('div');
  d.className = 'section-header';
  d.textContent = text;
  return d;
}
function makeFormGroup(label, el) {
  const w = document.createElement('div');
  w.className = 'form-group';
  const l = document.createElement('label');
  l.className = 'form-label';
  l.textContent = label;
  w.appendChild(l);
  w.appendChild(el);
  return w;
}
function makeInput(id, type, value = '', placeholder = '') {
  const i = document.createElement('input');
  i.className = 'form-control';
  i.id = id; i.type = type; i.value = value; i.placeholder = placeholder;
  return i;
}
function makeSelect(id, options, value) {
  const s = document.createElement('select');
  s.className = 'form-control';
  s.id = id;
  options.forEach(o => {
    const op = document.createElement('option');
    op.value = o; op.textContent = o || 'Select...';
    if (o === value) op.selected = true;
    s.appendChild(op);
  });
  return s;
}
